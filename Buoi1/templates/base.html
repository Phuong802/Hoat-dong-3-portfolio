<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Dashboard Hoc Tap{% endblock %}</title>
  <!-- Bootstrap 5 CDN -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css" rel="stylesheet">
  <!-- Custom CSS -->
  <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">
</head>
<body>

<!-- ── Navbar ── -->
<nav class="navbar navbar-expand-lg navbar-dark bg-primary shadow-sm">
  <div class="container">
    <a class="navbar-brand" href="{{ url_for('dashboard') }}">
      <i class="bi bi-book-half me-2"></i>Dashboard Hoc Tap
    </a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navMenu">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navMenu">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link {% if request.endpoint == 'dashboard' %}active{% endif %}"
             href="{{ url_for('dashboard') }}">
            <i class="bi bi-speedometer2 me-1"></i>Dashboard
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if 'mon_hoc' in request.endpoint %}active{% endif %}"
             href="{{ url_for('mon_hoc_list') }}">
            <i class="bi bi-journals me-1"></i>Mon hoc
          </a>
        </li>
        <li class="nav-item">
          <a class="nav-link {% if 'bai_tap' in request.endpoint %}active{% endif %}"
             href="{{ url_for('bai_tap_list') }}">
            <i class="bi bi-list-task me-1"></i>Bai tap
          </a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- ── Flash messages ── -->
<div class="container mt-3">
  {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
      {% for cat, msg in messages %}
        <div class="alert alert-{{ cat }} alert-dismissible fade show" role="alert">
          {{ msg }}
          <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
        </div>
      {% endfor %}
    {% endif %}
  {% endwith %}
</div>

<!-- ── Nội dung chính ── -->
<main class="container my-4">
  {% block content %}{% endblock %}
</main>

<!-- ── Footer ── -->
<footer class="text-center py-3 mt-4 border-top">
  <i class="bi bi-mortarboard me-1"></i>Dashboard Hoc Tap &copy; 2026
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
