{% extends "base.html" %}
{% block title %}{{ action }} Mon hoc{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6">
    <div class="card section-card p-4">
      <h3 class="mb-4">
        <i class="bi bi-book me-2 text-primary"></i>{{ action }} Mon hoc
      </h3>

      <form method="post">
        <!-- Ten mon hoc -->
        <div class="mb-3">
          <label class="form-label fw-semibold">Ten mon hoc <span class="text-danger">*</span></label>
          <input type="text" name="ten_mon" class="form-control"
                 placeholder="Vi du: Lap trinh Python"
                 value="{{ mon.ten_mon if mon else '' }}" required>
        </div>

        <!-- Giang vien -->
        <div class="mb-4">
          <label class="form-label fw-semibold">Giang vien <span class="text-danger">*</span></label>
          <input type="text" name="giang_vien" class="form-control"
                 placeholder="Vi du: Thay Nguyen Van A"
                 value="{{ mon.giang_vien if mon else '' }}" required>
        </div>

        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-save me-1"></i>Luu
          </button>
          <a href="{{ url_for('mon_hoc_list') }}" class="btn btn-outline-secondary">
            <i class="bi bi-x-lg me-1"></i>Huy
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
