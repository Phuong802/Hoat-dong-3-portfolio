{% extends "base.html" %}
{% block title %}{{ action }} Bai tap{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-7">
    <div class="card section-card p-4">
      <h3 class="mb-4">
        <i class="bi bi-list-task me-2 text-primary"></i>{{ action }} Bai tap
      </h3>
      <form method="post">
        <div class="mb-3">
          <label class="form-label fw-semibold">Ten bai tap <span class="text-danger">*</span></label>
          <input type="text" name="ten_bai" class="form-control"
                 placeholder="Vi du: Bai tap OOP"
                 value="{{ bai.ten_bai if bai else '' }}" required>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Mon hoc <span class="text-danger">*</span></label>
          <select name="mon_hoc_id" class="form-select" required>
            <option value="">-- Chon mon hoc --</option>
            {% for m in mon_hocs %}
            <option value="{{ m.id }}"
              {% if bai and bai.mon_hoc_id == m.id %}selected{% endif %}>
              {{ m.ten_mon }}
            </option>
            {% endfor %}
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label fw-semibold">Han nop <span class="text-danger">*</span></label>
          <input type="date" name="han_nop" class="form-control"
                 value="{{ bai.han_nop if bai else '' }}" required>
        </div>
        <div class="mb-4">
          <label class="form-label fw-semibold">Trang thai</label>
          <div class="d-flex gap-3">
            <div class="form-check">
              <input class="form-check-input" type="radio" name="trang_thai"
                     value="Chua lam" id="chua_lam"
                     {% if not bai or bai.trang_thai == 'Chua lam' %}checked{% endif %}>
              <label class="form-check-label" for="chua_lam">
                <span class="badge badge-todo px-2 py-1">Chua lam</span>
              </label>
            </div>
            <div class="form-check">
              <input class="form-check-input" type="radio" name="trang_thai"
                     value="Da xong" id="da_xong"
                     {% if bai and bai.trang_thai == 'Da xong' %}checked{% endif %}>
              <label class="form-check-label" for="da_xong">
                <span class="badge badge-done px-2 py-1">Da xong</span>
              </label>
            </div>
          </div>
        </div>
        <div class="d-flex gap-2">
          <button type="submit" class="btn btn-primary">
            <i class="bi bi-save me-1"></i>Luu
          </button>
          <a href="{{ url_for('bai_tap_list') }}" class="btn btn-outline-secondary">
            <i class="bi bi-x-lg me-1"></i>Huy
          </a>
        </div>
      </form>
    </div>
  </div>
</div>
{% endblock %}
